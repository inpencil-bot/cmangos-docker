name: "<template>"
on:
  workflow_call:
    inputs:
      expansion:
        required: true
        type: string

jobs:
  build-builder:
    name: "Builder"
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/CMaNGOS/${{ inputs.expansion }}/builder
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Definition of build arguments
        run: |
          MANGOS_SHA1="$(git ls-remote https://github.com/cmangos/mangos-${{ inputs.expansion }}.git refs/heads/master | cut -f1)" && \
          DATABASE_SHA1="$(git ls-remote https://github.com/cmangos/${{ inputs.expansion }}-db.git refs/heads/master | cut -f1)" && \
          \
          [[ -n "${MANGOS_SHA1}" ]] || { echo "Unable to resolve the latest 'mangos-${{ inputs.expansion }}' commit SHA." >&2; exit 1; } && \
          [[ -n "${DATABASE_SHA1}" ]] || { echo "Unable to resolve the latest '${{ inputs.expansion }}-db' commit SHA." >&2; exit 1; } && \
          \
          echo MANGOS_SHA1="${MANGOS_SHA1}" >> "${GITHUB_ENV}" && \
          echo DATABASE_SHA1="${DATABASE_SHA1}" >> "${GITHUB_ENV}" && \
          \
          echo TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_ENV}" && \
          echo VERSION_CODE="1.0.0-nightly+$(date -u +"%Y%m%d")" >> "${GITHUB_ENV}"

      - name: Build & push the Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          push: true
          build-args: |
            EXPANSION=${{ inputs.expansion }}
            MANGOS_SHA1=${{ env.MANGOS_SHA1 }}
            DATABASE_SHA1=${{ env.DATABASE_SHA1 }}
            THREADS=2
            COMMIT_SHA=${{ github.sha }}
            CREATE_DATE=${{ env.TIMESTAMP }}
            VERSION=${{ env.VERSION_CODE }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=builder-${{ inputs.expansion }}
          cache-to: type=gha,mode=max,scope=builder-${{ inputs.expansion }}

  build-runner:
    name: "Runner"
    needs: build-builder
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/CMaNGOS/${{ inputs.expansion }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Definition of build arguments
        run: |
          MANGOS_SHA1="$(git ls-remote https://github.com/cmangos/mangos-${{ inputs.expansion }}.git refs/heads/master | cut -f1)" && \
          DATABASE_SHA1="$(git ls-remote https://github.com/cmangos/${{ inputs.expansion }}-db.git refs/heads/master | cut -f1)" && \
          \
          [[ -n "${MANGOS_SHA1}" ]] || { echo "Unable to resolve the latest 'mangos-${{ inputs.expansion }}' commit SHA." >&2; exit 1; } && \
          [[ -n "${DATABASE_SHA1}" ]] || { echo "Unable to resolve the latest '${{ inputs.expansion }}-db' commit SHA." >&2; exit 1; } && \
          \
          echo MANGOS_SHA1="${MANGOS_SHA1}" >> "${GITHUB_ENV}" && \
          echo DATABASE_SHA1="${DATABASE_SHA1}" >> "${GITHUB_ENV}" && \
          \
          echo TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_ENV}" && \
          echo VERSION_CODE="1.0.0-nightly+$(date -u +"%Y%m%d")" >> "${GITHUB_ENV}"

      - name: Build & push the Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          build-args: |
            EXPANSION=${{ inputs.expansion }}
            MANGOS_SHA1=${{ env.MANGOS_SHA1 }}
            DATABASE_SHA1=${{ env.DATABASE_SHA1 }}
            THREADS=2
            COMMIT_SHA=${{ github.sha }}
            CREATE_DATE=${{ env.TIMESTAMP }}
            VERSION=${{ env.VERSION_CODE }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: |
            type=gha,scope=builder-${{ inputs.expansion }}
            type=gha,scope=runner-${{ inputs.expansion }}

          cache-to: type=gha,mode=max,scope=runner-${{ inputs.expansion }}
